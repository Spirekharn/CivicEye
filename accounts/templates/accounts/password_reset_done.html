{% extends 'base.html' %}
{% block title %}Reset Link Sent{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:2rem">
  <div style="width:100%;max-width:460px">
    <div class="card tc">
      <div style="font-size:2.5rem;margin-bottom:1rem">📧</div>
      <h2 style="font-size:1.3rem;margin-bottom:.5rem">Check your email</h2>
      <p class="sm muted mb2">
        If an account exists for that address, we have sent a password reset link.
        In development mode the link appears in your terminal output.
      </p>
      <a href="{% url 'login' %}" class="btn btn-pr">Back to Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
