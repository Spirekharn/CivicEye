{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:2rem">
  <div style="width:100%;max-width:460px">
    <div class="tc mb3">
      <h2 style="font-size:1.4rem;margin-bottom:.4rem">Forgot your password?</h2>
      <p class="sm muted">Enter your email address and we will send you a reset link.</p>
    </div>
    <div class="card">
      <form method="post">
        {% csrf_token %}
        <div class="fg">
          <label class="label" for="id_email">Email Address</label>
          <input class="input" type="email" name="email" id="id_email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <button type="submit" class="btn btn-pr btn-full">Send Reset Link</button>
      </form>
      <div class="hr"></div>
      <p class="tc sm muted">Remembered it? <a href="{% url 'login' %}" class="text-pr semi">Sign in</a></p>
    </div>
  </div>
</div>
{% endblock %}
