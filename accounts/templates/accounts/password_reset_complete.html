{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div style="min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:2rem">
  <div style="width:100%;max-width:460px">
    <div class="card tc">
      <div style="font-size:2.5rem;margin-bottom:1rem">✅</div>
      <h2 style="font-size:1.3rem;margin-bottom:.5rem">Password updated</h2>
      <p class="sm muted mb2">Your password has been set. You can now sign in with your new credentials.</p>
      <a href="{% url 'login' %}" class="btn btn-pr">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
