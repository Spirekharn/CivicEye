{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <h2>Assign Complaint</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Select User:</label>

        <select name="user" class="form-control mb-3">
            {% for u in users %}
                <option value="{{ u.id }}">{{ u.username }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn btn-dark">
            Assign
        </button>
    </form>
</div>

{% endblock %}
