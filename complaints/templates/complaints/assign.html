{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">
    <h2>Assign Complaint</h2>
    <p><strong>Complaint:</strong> {{ complaint.title }}</p>

    <form method="POST">
        {% csrf_token %}

        <label>Select User:</label>

        <select name="user" class="form-control mb-3">
            {% for u in users %}
                <option value="{{ u.id }}">
                    {{ u.username }} ({{ u.role }})
                </option>
            {% endfor %}
        </select>
        <button type="submit" class="btn btn-dark w-100">
            Assign
        </button>
    </form>
</div>

{% endblock %}
